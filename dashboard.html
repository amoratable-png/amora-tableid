<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amora Table — Dashboard</title>
<style>
:root{--pink:#a90058;--pink2:#c51b70;--soft:#fff4f9;--ink:#2d1c27;--muted:#806d78;--line:#efdce6;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:#f8f9fb;color:var(--ink)}
.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.hamb{font-size:28px;color:var(--pink);cursor:pointer}.logo{font:700 25px Georgia,serif}.logo span{color:var(--pink2)}.avatar{width:45px;height:45px;border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--pink);font-weight:800}
.wrap{max-width:1050px;margin:auto;padding:18px 16px 45px}.receiver{display:block;text-align:center;background:#17182e;color:#fff;border-radius:30px;padding:14px 18px;text-decoration:none;font-weight:700;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tile{border:0;border-radius:20px;min-height:150px;background:linear-gradient(145deg,var(--pink2),var(--pink));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;box-shadow:0 7px 18px #9f1b5b20;cursor:pointer;transition:.15s}.tile:active{transform:scale(.97)}.icon{font-size:46px;line-height:1}.label{font-size:18px;font-weight:800}.send{background:linear-gradient(145deg,#e5a800,#f5c300)}
.panel{display:none;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.panel.active{display:block}.panel h2{margin:0 0 6px;font:700 25px Georgia,serif}.panel p{color:var(--muted);margin:0 0 15px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--pink2);color:#fff;font-weight:800}.preview{background:var(--soft);padding:15px;border-radius:16px;margin-top:15px}.close{float:right;border:0;background:#f3e4eb;border-radius:50%;width:34px;height:34px}
@media(max-width:600px){.top{height:66px;padding:0 14px}.logo{font-size:22px}.grid{gap:10px}.tile{min-height:128px;border-radius:17px}.icon{font-size:38px}.label{font-size:15px}.wrap{padding:15px 10px 35px}}
</style></head>
<body>
<header class="top"><div class="hamb" onclick="alert('Menu Amora Table')">☰</div><div class="logo">Amora <span>Table</span></div><div class="avatar">AT</div></header>
<main class="wrap">
<a class="receiver" href="#" onclick="alert('Layar penerima tamu akan dibuka di versi berikutnya');return false">▣ Buka Layar Penerima Tamu</a>
<section class="grid">
<button class="tile" onclick="openPanel('pengantin')"><span class="icon">💍</span><span class="label">Pengantin</span></button>
<button class="tile" onclick="openPanel('tema')"><span class="icon">🎨</span><span class="label">Tema</span></button>
<button class="tile" onclick="openPanel('acara')"><span class="icon">📅</span><span class="label">Acara</span></button>
<button class="tile" onclick="openPanel('galeri')"><span class="icon">🖼️</span><span class="label">Galeri</span></button>
<button class="tile" onclick="openPanel('musik')"><span class="icon">🎵</span><span class="label">Musik</span></button>
<button class="tile" onclick="openPanel('ucapan')"><span class="icon">💬</span><span class="label">Ucapan</span></button>
<button class="tile" onclick="openPanel('kado')"><span class="icon">🎁</span><span class="label">Kado</span></button>
<button class="tile" onclick="openPanel('rsvp')"><span class="icon">💌</span><span class="label">RSVP</span></button>
<button class="tile" onclick="openPanel('streaming')"><span class="icon">📺</span><span class="label">Streaming</span></button>
<button class="tile" onclick="openPanel('kisah')"><span class="icon">💕</span><span class="label">Kisah Cinta</span></button>
<button class="tile" onclick="openPanel('story')"><span class="icon">📱</span><span class="label">Story IG</span></button>
<button class="tile" onclick="openPanel('quote')"><span class="icon">❝</span><span class="label">Quote</span></button>
<button class="tile" onclick="openPanel('setting')"><span class="icon">⚙️</span><span class="label">Setting</span></button>
<button class="tile" onclick="openPanel('buku')"><span class="icon">📖</span><span class="label">Buku Tamu</span></button>
<button class="tile send" onclick="openPanel('kirim')"><span class="icon">➤</span><span class="label">Kirim</span></button>
</section>
<div id="panel" class="panel"><button class="close" onclick="closePanel()">×</button><h2 id="title">Amora Table</h2><p id="desc">Kelola bagian undanganmu.</p><div id="content"></div></div>
</main>
<script>
const data={
pengantin:['Pengantin','Isi nama mempelai dan orang tua.','<div class="field"><label>Nama mempelai</label><input value="Reny & Ibnu"></div><div class="field"><label>Nama orang tua</label><input value="Bapak & Ibu kedua mempelai"></div><button class="btn" onclick="save()">Simpan</button>'],
tema:['Tema','Pilih tampilan undangan.','<select><option>Romantic Blush</option><option>Classic Elegant</option><option>Modern Minimal</option></select>'],
acara:['Acara','Atur akad dan resepsi.','<div class="field"><label>Tanggal</label><input type="date"></div><div class="field"><label>Jam</label><input type="time"></div><div class="field"><label>Lokasi</label><input placeholder="Nama gedung / tempat"></div><button class="btn" onclick="save()">Simpan</button>'],
galeri:['Galeri','Tambahkan foto prewedding dan momen acara.','<input type="file" accept="image/*" multiple><p style="margin-top:10px">Upload foto akan kita aktifkan penuh pada tahap berikutnya.</p>'],
musik:['Musik','Pilih musik untuk undangan.','<input type="file" accept="audio/*">'],
ucapan:['Ucapan','Kelola kolom ucapan dan doa.','<textarea rows="5" placeholder="Tulis pengaturan ucapan..."></textarea>'],
kado:['Kado','Tambahkan rekening atau alamat kado.','<div class="field"><label>Bank</label><input placeholder="BCA / Mandiri"></div><div class="field"><label>Nomor rekening</label><input></div>'],
rsvp:['RSVP','Atur konfirmasi kehadiran.','<div class="field"><label>Batas konfirmasi</label><input type="date"></div><button class="btn">Simpan</button>'],
streaming:['Streaming','Tambahkan link live streaming.','<input placeholder="Link YouTube / Zoom / lainnya">'],
kisah:['Kisah Cinta','Tulis perjalanan cinta pasangan.','<textarea rows="7" placeholder="Tulis kisah cinta..."></textarea>'],
story:['Story IG','Tambahkan link Story Instagram.','<input placeholder="https://instagram.com/...">'],
quote:['Quote','Tambahkan kutipan pembuka/penutup.','<textarea rows="4" placeholder="Quote pilihanmu..."></textarea>'],
setting:['Setting','Atur nama link dan pengaturan undangan.','<div class="field"><label>Slug undangan</label><input value="reny-ibnu"></div><button class="btn" onclick="save()">Simpan</button>'],
buku:['Buku Tamu','Kelola pesan tamu yang masuk.','<p>Belum ada pesan tamu.</p>'],
kirim:['Kirim','Undanganmu siap dibagikan.','<div class="preview"><b>Link undangan:</b><br><span id="link">amoratable.my.id/reny-ibnu</span></div><button class="btn" onclick="navigator.clipboard?.writeText('https://amoratable.my.id/reny-ibnu');alert('Link disalin!')">Salin Link</button>']};
function openPanel(k){let d=data[k];title.textContent=d[0];desc.textContent=d[1];content.innerHTML=d[2];panel.classList.add('active');panel.scrollIntoView({behavior:'smooth',block:'start'})}
function closePanel(){panel.classList.remove('active')}
function save(){alert('Tersimpan di perangkat ini. Sistem database/publish akan kita sambungkan berikutnya.')}
</script></body></html>
